<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ensemble Monitor</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' rx='3' fill='%2314161a'/%3E%3Ccircle cx='5' cy='8' r='2.2' fill='%236aa9ff'/%3E%3Ccircle cx='11' cy='8' r='2.2' fill='%237ec98f'/%3E%3C/svg%3E">
<link rel="stylesheet" href="./app.css">
</head>
<body>
<header>
  <h1>ENSEMBLE MONITOR</h1>
  <nav class="tabs" id="tabBar" role="tablist" aria-label="View">
    <button type="button" class="tab active" id="tabMonitor" role="tab" aria-selected="true" aria-controls="monitorView">monitor</button>
    <button type="button" class="tab" id="tabAccounts" role="tab" aria-selected="false" aria-controls="accountsView">accounts</button>
    <!-- data-axis="x" is not decorative: slideSelection() defaults to the vertical
         orientation (#selBar's), and without this the underline is driven on the wrong
         axis, keeps its width: 0, and never shows up behind the active tab. -->
    <span id="tabUnderline" data-axis="x" aria-hidden="true"></span>
  </nav>
  <div class="health" aria-live="polite">
    <span class="dot" id="health" aria-hidden="true"></span>
    <span id="healthText" class="hint">connecting…</span>
  </div>
  <span class="spacer"></span>
  <label class="checkbox">
    <input type="checkbox" id="autoscroll" checked>
    follow
  </label>
  <button type="button" id="refresh" class="btn">refresh</button>
</header>

<main id="monitorView">
  <section class="col">
    <h2 class="col-hd">
      Teams
      <span class="spacer"></span>
      <span id="teamCount"></span>
      <button type="button" id="toggleNew" class="btn ghost" aria-label="Show new team form">+ new</button>
    </h2>
    <form id="newTeam" class="new-team-form" hidden>
      <label for="ntTask">Task</label>
      <textarea id="ntTask" rows="4" placeholder="Task for the team…"></textarea>
      <label for="ntAgents">Agents</label>
      <input id="ntAgents" value="codex, claude code" title="Comma-separated. The first is the lead.">
      <label for="ntCwd">Working directory</label>
      <input id="ntCwd" placeholder="working directory (blank = server cwd)">
      <div class="row">
        <button type="submit" id="ntGo" class="btn">launch</button>
        <span id="ntStatus" role="status"></span>
      </div>
    </form>
    <!-- #selBar must live INSIDE #teams: .scroll is the positioned ancestor, and a bar
         parked outside it would stay put while the rows scrolled away underneath. The
         is-static class is what keeps reconcile() from treating it as a dead row. -->
    <div class="scroll" id="teams"><div id="selBar" class="is-static" aria-hidden="true"></div></div>
  </section>

  <section class="col">
    <h2 class="col-hd">
      Transcript
      <span class="spacer"></span>
      <span id="teamTitle" class="hint"></span>
      <button type="button" id="disband" class="btn danger" disabled>disband</button>
    </h2>
    <div class="scroll" id="feed"><div class="empty is-placeholder">Select a team.</div></div>
    <form class="composer" id="composer">
      <select id="to" aria-label="Send to"><option value="team">→ team</option></select>
      <input id="text" placeholder="steer the team…" autocomplete="off" aria-label="Message" disabled>
      <button type="submit" id="send" class="btn" disabled>send</button>
    </form>
  </section>

  <section class="col">
    <h2 class="col-hd">
      Agent panes
      <span class="spacer"></span>
      <span class="hint">live PTY</span>
    </h2>
    <div class="scroll" id="panes"><div class="empty is-placeholder">Select a team.</div></div>
    <section class="drawer">
      <h2 class="col-hd">
        Server log
        <span class="spacer"></span>
        <button type="button" id="clearLog" class="btn ghost">clear</button>
      </h2>
      <div class="scroll" id="log"></div>
    </section>
  </section>
</main>

<section class="col" id="accountsView" hidden>
  <h2 class="col-hd">
    Accounts
    <span class="spacer"></span>
    <button type="button" id="refreshAccounts" class="btn ghost">refresh</button>
  </h2>
  <div class="scroll" id="accounts"></div>
</section>

<script src="./vendor/motion.dom.js"></script>
<script type="module" src="./js/app.js"></script>
</body>
</html>
